<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff Tools | Cornerstone Fellowship</title>
  <meta name="theme-color" content="#F5F7F8">
  <link rel="icon" href="shared/assets/brand/cf-icon-black.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="shared/css/tokens.css">
  <link rel="stylesheet" href="shared/css/base.css">
  <style>
    body { display: block; }
    .home-wrap { max-width: 760px; margin: 0 auto; padding: var(--space-6) var(--space-3); }
    .home-wrap img { height: 30px; width: auto; display: block; margin-bottom: var(--space-5); }
    .home-wrap h1 { font-size: clamp(1.8rem, 5vw, 2.4rem); }
    .home-wrap .lede { margin: var(--space-2) 0 0; color: var(--slate); font-size: 1rem; }
  </style>
</head>
<body>
  <main class="home-wrap">
    <img src="shared/assets/brand/cf-logo-horizontal-black.png" alt="Cornerstone Fellowship" width="210" height="41">
    <h1>Staff Tools</h1>
    <p class="lede">Internal tools for Cornerstone Fellowship staff.</p>
    <ul id="tool-list" class="tool-list"></ul>
  </main>
  <script type="module" src="shared/js/home.js"></script>
</body>
</html>

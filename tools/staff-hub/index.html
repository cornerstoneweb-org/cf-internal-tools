<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff Hub | Cornerstone Fellowship</title>
  <meta name="theme-color" content="#F5F7F8">
  <link rel="icon" href="../../shared/assets/brand/cf-icon-black.png">
  <link rel="apple-touch-icon" href="../../shared/assets/brand/favicon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="../../shared/css/tokens.css">
  <link rel="stylesheet" href="../../shared/css/base.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <aside class="side">
    <div class="side-brand">
      <a href="#/home"><img src="../../shared/assets/brand/cf-logo-horizontal-black.png"
        alt="Cornerstone Fellowship" width="210" height="41"></a>
    </div>
    <nav class="side-nav" id="nav" aria-label="Sections"></nav>
    <div class="side-me">
      <div class="avatar" id="avatar">CF</div>
      <div><b id="me-name">Cornerstone Staff</b><span id="me-role">Staff Hub</span></div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="search">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="2"/>
          <path d="M13.5 13.5 18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input type="search" id="search" autocomplete="off" spellcheck="false" aria-label="Search the hub">
        <kbd id="kbd" aria-hidden="true">/</kbd>
        <button type="button" class="search-clear" id="clear" hidden aria-label="Clear search">&times;</button>
      </div>
      <div class="topbar-right">
        <a class="btn" id="primary-action" href="#/requests">+ New request</a>
      </div>
    </header>

    <main class="content" id="main">
      <div id="announce"></div>
      <div id="view"></div>
    </main>

    <footer class="foot">
      <p id="contact"></p>
      <p id="health"></p>
    </footer>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
